name: Generate PALATE sandbox app icons
on:
  push:
    paths:
      - 'sandbox/palate-icon.svg'
      - '.github/workflows/palate-sandbox-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg
      - name: Render iPhone and PWA icons
        run: |
          python - <<'PY'
          import cairosvg
          for size in (180,192,512):
              cairosvg.svg2png(url="sandbox/palate-icon.svg",write_to=f"sandbox/palate-icon-{size}.png",output_width=size,output_height=size)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox/palate-icon-180.png sandbox/palate-icon-192.png sandbox/palate-icon-512.png
          git diff --cached --quiet || (git commit -m "Render PALATE sandbox icons as PNG" && git push)
